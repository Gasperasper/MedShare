<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedShare - Gestión de Insumos Médicos</title>
    <!-- Vinculamos los estilos limpios -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h1>MedShare</h1>
    <div class="subtitle">Plataforma de gestión e intercambio de insumos médicos</div>

    <form id="insumoForm">
        <div class="form-group">
            <label for="nombreInsumo">Nombre del Insumo:</label>
            <input type="text" id="nombreInsumo" placeholder="Ej. Paracetamol 500mg o Silla de ruedas" required>
        </div>

        <div class="form-group">
            <label for="categoria">Categoría:</label>
            <select id="categoria" required>
                <option value="">Selecciona una categoría</option>
                <option value="Medicamentos">Medicamentos</option>
                <option value="Equipo médico">Equipo médico</option>
                <option value="Material de curación">Material de curación</option>
            </select>
        </div>

        <div class="form-group">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" min="1" placeholder="Ej. 10" required>
        </div>

        <div class="form-group">
            <label for="fechaCaducidad">Fecha de Caducidad:</label>
            <input type="date" id="fechaCaducidad" required>
        </div>

        <button type="submit">Registrar Insumo</button>
    </form>

    <div id="resultado"></div>
</div>

<!-- Vinculamos la lógica del navegador -->
<script src="frontend.js"></script>

</body>
</html>
